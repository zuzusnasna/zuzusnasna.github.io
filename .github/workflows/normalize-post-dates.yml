name: Normalize study post dates

on:
  push:
    branches: [main]
    paths:
      - '_posts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Assign random dates between 2026-07-13 and 2026-10-30
        run: |
          python3 <<'PY'
          from pathlib import Path
          from datetime import date, timedelta
          import random, re

          start = date(2026, 7, 13)
          end = date(2026, 10, 30)
          days = []
          current = start
          while current <= end:
              days.append(current)
              current += timedelta(days=1)

          posts = sorted(Path('_posts').glob('*.md'))
          random.SystemRandom().shuffle(days)

          for index, path in enumerate(posts):
              if index >= len(days):
                  chosen = random.choice(days)
              else:
                  chosen = days[index]

              text = path.read_text(encoding='utf-8')
              replacement = f'date: {chosen.isoformat()} 00:00:00 +0900'
              text, count = re.subn(r'^date:\s*.*$', replacement, text, count=1, flags=re.MULTILINE)
              if count:
                  path.write_text(text, encoding='utf-8')

          print(f'Updated {len(posts)} posts.')
          PY

      - name: Commit normalized dates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _posts
          if git diff --cached --quiet; then
            echo 'No date changes.'
            exit 0
          fi
          git commit -m 'chore: normalize study post dates'
          git push
