<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">주상혁 <span>· 개발 블로그</span></a>
      <nav><a href="{{ '/' | relative_url }}">Posts</a><a href="{{ '/projects/' | relative_url }}">Projects</a><a href="https://zuzusnasna.github.io/portfolio/">Portfolio</a><a href="https://github.com/zuzusnasna">GitHub</a></nav>
    </div>
  </header>
  <main class="page-wrap">{{ content }}</main>
  <footer><div>Java · Spring Boot · JPA · Database · Redis · AWS</div></footer>
</body>
</html>
