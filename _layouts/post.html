---
layout: default
---
<article class="post-detail">
  <div class="post-date">{{ page.date | date: "%Y.%m.%d" }}</div>
  {% assign display_title = page.title | remove_first: '개인 프로젝트 : ' | remove_first: '팀 프로젝트 : ' | remove_first: '설계 : ' | remove_first: '부트캠프 : ' %}
  <h1>{{ display_title }}</h1>
  <div class="post-tags">{% for tag in page.tags %}<a href="{{ '/' | relative_url }}?tag={{ tag | slugify }}">#{{ tag }}</a>{% endfor %}</div>
  <nav class="post-toc" id="post-toc" aria-label="목차" hidden>
    <h2 class="toc-title">목차</h2>
    <ul id="post-toc-list"></ul>
  </nav>
  <div class="post-content" id="post-content">{{ content }}</div>
</article>
<div class="reading-progress" id="reading-progress" aria-hidden="true"></div>
<script>
(() => {
  const content = document.getElementById('post-content');
  if (!content) return;
  const headings = [...content.querySelectorAll('h2')];
  const toc = document.getElementById('post-toc');
  const list = document.getElementById('post-toc-list');
  const slugify = text => text.toLocaleLowerCase('ko-KR').trim()
    .replace(/[^\p{L}\p{N}\s-]/gu, '').replace(/\s+/g, '-');
  const seen = new Set();
  headings.forEach((heading, index) => {
    if (!heading.id) {
      let id = slugify(heading.textContent) || 'section-' + (index + 1);
      const base = id;
      let suffix = 2;
      while (seen.has(id) || document.getElementById(id)) id = base + '-' + suffix++;
      heading.id = id;
      seen.add(id);
    }
    const item = document.createElement('li');
    const link = document.createElement('a');
    link.href = '#' + heading.id;
    link.textContent = heading.textContent;
    item.appendChild(link);
    list.appendChild(item);
  });
  if (headings.length >= 3) toc.hidden = false;
  const progress = document.getElementById('reading-progress');
  const updateProgress = () => {
    if (!progress) return;
    const max = document.documentElement.scrollHeight - window.innerHeight;
    const value = max > 0 ? Math.min(100, Math.max(0, window.scrollY / max * 100)) : 0;
    progress.style.width = value + '%';
  };
  window.addEventListener('scroll', updateProgress, {passive:true});
  window.addEventListener('resize', updateProgress);
  updateProgress();
})();
</script>
